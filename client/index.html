<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>合同工作台</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="brand">合同工作台</h1>
    <label class="role-picker">
      身份（mock）
      <select id="role">
        <option value="viewer">viewer·只读</option>
        <option value="editor" selected>editor·编辑</option>
        <option value="legal">legal·法务复核</option>
        <option value="admin">admin·管理员</option>
      </select>
      <input id="userid" size="6" value="u_1" title="mock 用户 id（提交人不能审批自己）" />
    </label>
  </header>

  <p id="banner" class="banner" hidden></p>
  <p id="error" class="error" hidden></p>

  <main id="app">
    <section class="panel">
      <div class="panel-head">
        <h2>合同列表</h2>
        <button id="refresh" type="button" class="btn">刷新</button>
      </div>
      <table class="contract-table">
        <thead>
          <tr><th>标题</th><th>相对方</th><th>金额（元）</th><th>状态</th></tr>
        </thead>
        <tbody id="contract-list"></tbody>
      </table>
    </section>

    <section class="panel">
      <h2>新建合同</h2>
      <form id="new-form" class="grid-form">
        <label>标题 <input name="title" required /></label>
        <label>相对方
          <select name="counterparty_id" id="cp-select" required></select>
        </label>
        <label>金额（元） <input name="amount_yuan" type="number" min="0" step="0.01" required /></label>
        <label>开始 <input name="start_date" type="date" required /></label>
        <label>结束 <input name="end_date" type="date" required /></label>
        <label class="full">备注 <textarea name="description"></textarea></label>
        <button type="submit" class="btn primary">创建</button>
      </form>
    </section>

    <section class="panel" id="detail-panel" hidden>
      <div class="panel-head">
        <h2>合同详情</h2>
        <button id="close-detail" type="button" class="btn">收起</button>
      </div>
      <dl id="detail" class="detail"></dl>
      <form id="status-form" class="inline-form">
        <select id="status-to" class="status-select"></select>
        <button type="submit" class="btn">迁移</button>
      </form>
      <form id="desc-form" class="inline-form">
        <input name="description" class="grow" placeholder="补充备注（主体字段已冻结时仅此项可改）" />
        <button type="submit" class="btn">保存备注</button>
      </form>
      <section id="approval-panel" hidden>
        <h3>审批</h3>
        <button id="submit-approval" type="button" class="btn primary" hidden>提交审批</button>
        <div id="approval-chain"></div>
        <form id="approval-action" class="inline-form" hidden>
          <input name="comment" class="grow" placeholder="审批意见（必填）" />
          <button type="submit" name="approve" class="btn">通过</button>
          <button type="submit" name="reject" class="btn danger">驳回</button>
        </form>
      </section>
    </section>

    <section class="panel" id="cp-panel">
      <div class="panel-head"><h2>相对方管理</h2></div>
      <table class="contract-table">
        <thead><tr><th>名称</th><th>信用代码</th><th>风险</th><th>联系人</th><th></th></tr></thead>
        <tbody id="cp-list"></tbody>
      </table>
      <form id="cp-form" class="grid-form">
        <label>名称 <input name="name" required /></label>
        <label>统一社会信用代码 <input name="credit_code" required size="18" /></label>
        <label>风险评级
          <select name="risk_rating">
            <option value="C" selected>C</option><option value="B">B</option><option value="A">A</option><option value="D">D</option>
          </select>
        </label>
        <label>联系人 <input name="contact" /></label>
        <button type="submit" id="cp-submit" class="btn primary">新增相对方</button>
      </form>
      <p id="cp-error" class="error" hidden></p>
    </section>

    <section class="panel" id="am-panel">
      <div class="panel-head"><h2>变更单</h2></div>
      <form id="am-form" class="grid-form">
        <label>父合同 <select name="parent_contract_id" id="am-parent" required></select></label>
        <label>变更字段
          <select name="field" id="am-field">
            <option value="amount">金额</option>
            <option value="end_date">结束日期</option>
            <option value="currency">币种</option>
            <option value="title">标题</option>
          </select>
        </label>
        <label>新值 <input name="value" id="am-value" required /></label>
        <label class="full">变更原因 <textarea name="reason" required></textarea></label>
        <button type="submit" class="btn primary">创建变更单</button>
      </form>
      <table class="contract-table">
        <thead><tr><th>变更</th><th>父合同</th><th>状态</th><th></th></tr></thead>
        <tbody id="am-list"></tbody>
      </table>
      <section id="am-detail" hidden>
        <h3>变更对照</h3>
        <dl id="am-comparison" class="detail"></dl>
        <button id="am-submit" type="button" class="btn" hidden>提交</button>
        <button id="am-approve" type="button" class="btn primary" hidden>通过</button>
        <button id="am-reject" type="button" class="btn danger" hidden>驳回</button>
        <button id="am-apply" type="button" class="btn" hidden>应用</button>
      </section>
    </section>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
